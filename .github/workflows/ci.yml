name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Compile Python sources
        run: python -m compileall -q src tests

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Build wheel and sdist
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Smoke-test installed distributions away from checkout
        shell: bash
        run: |
          set -euo pipefail
          repository="$(pwd)"
          smoke="$(mktemp -d)"
          for artifact in "$repository"/dist/*.whl "$repository"/dist/*.tar.gz; do
            case "$artifact" in
              *.whl) kind="wheel" ;;
              *.tar.gz) kind="sdist" ;;
            esac
            environment="$smoke/$kind"
            python -m venv "$environment/venv"
            "$environment/venv/bin/python" -m pip install "$artifact"
            "$environment/venv/bin/python" -m pip check
            mkdir -p "$environment/work"
            cd "$environment/work"
            test "$("$environment/venv/bin/canary-matrix" version)" = "0.2.0"
            "$environment/venv/bin/python" -c 'from canary_matrix.cli import resolve_contract; from canary_matrix.contract import load_contract; print(load_contract(resolve_contract()).contract_id)'
            "$environment/venv/bin/python" -c 'from pathlib import Path; import sysconfig; from canary_matrix.contract import load_contract; root = Path(sysconfig.get_path("data")) / "share" / "canary-matrix" / "contracts"; assert load_contract(root / "codex-trust-enter-39487.toml").contract_id == "codex-trust-enter-39487"'
            cd "$repository"
          done
