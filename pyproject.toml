[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "canary-matrix"
version = "0.2.0"
description = "Credential-free, evidence-bound CLI canary comparisons"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arshya Bahal" }]
keywords = ["ai", "coding-agents", "cli", "regression-testing", "reliability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/ArshyaAI/canary-matrix"
Repository = "https://github.com/ArshyaAI/canary-matrix"
Issues = "https://github.com/ArshyaAI/canary-matrix/issues"
Changelog = "https://github.com/ArshyaAI/canary-matrix/blob/main/CHANGELOG.md"

[project.scripts]
canary-matrix = "canary_matrix.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Contracts are kept at repository top level for reviewability.  data-files
# makes them available to an installed wheel without duplicating or rewriting
# the source contracts.
[tool.setuptools.data-files]
"share/canary-matrix/contracts" = ["contracts/*.toml"]
